<!doctype html>
<html lang="vi">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Baddie Club — Match &amp; Reveal</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/baddie/brand.svg">
    <link rel="stylesheet" href="/style.css">
    <meta name="description" content="Match fashion pieces, reveal AI portraits, and build your Baddie collection." />
    <style>
      :root {
        --vh: 1vh;
      }
      
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: #180e1b;
        overflow: hidden; /* Cấm tuyệt đối việc cuộn trang */
      }

      /* Mặc định cho Android/PC (Giữ nguyên) */
      #app, canvas {
        width: 100%;
        height: 100vh; 
      }

      /* --- CHỈ ÁP DỤNG CHO IPHONE/IPAD (iOS) --- */
      @supports (-webkit-touch-callout: none) {
        #app, canvas {
          /* 100dvh = Chiều cao màn hình TRỪ ĐI thanh địa chỉ của Safari */
          height: 100dvh !important; 
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
